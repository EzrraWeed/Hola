<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feliz Cumpleaños</title>
  <link rel="stylesheet" href="style.css">
  <!-- Fuentes estilizadas de Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>

  <div class="container">
    <!-- Título -->
    <h1 class="title">Feliz Cumpleaños</h1>

    <!-- DOmo de cristal -->
    <div class="glass-dome-container">
      <div class="glass-dome">
        <div class="rose">
          <div class="flower">
            <div class="petal petal-1"></div>
            <div class="petal petal-2"></div>
            <div class="petal petal-3"></div>
          </div>
          <div class="stem"></div>
          <div class="leaf leaf-1"></div>
          <div class="leaf leaf-2"></div>
        </div>
        <!-- Destellos -->
        <div class="sparkles">
          <span></span><span></span><span></span><span></span>
        </div>
      </div>
      <div class="base"></div>
    </div>

    <!-- Botón -->
    <button id="open-btn" class="btn-read">De mí para tú</button>

  <!--Carta -->
  <div id="letter-modal" class="modal hidden">
    <div class="letter-card">
      <button id="close-btn" class="close-btn">&times;</button>
      
      <h2 class="letter-title">Feliz Cumpleaños</h2>
      
      <p class="letter-body">
        Heyy!! Espero que disfrutes tu dia y la pases bien con las personas que quieres, recuerda que eres muy especial y mereces todo lo bomnito que te pase.
        <br><br>
        A pesar de que nos hemos alejado sigues siendo alguien muy importante para mi.
      </p>

      <div class="letter-footer">
        <h3>Fuerzas Leona</h3>
        <span class="tag">Para tú</span>
      </div>

      <!-- Decoración -->
      <div class="flowers-deco">
        🎂 🎂 🎂
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
